name: lab-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------------------
  # Workloads
  # ---------------------------------------------------------------------------
  # Everything under this heading is disposable. Nothing else in the lab may
  # depend on a service here, and a workload that becomes load-bearing has
  # outgrown this repo -- promote it to its own stack rather than hardening it
  # in place. See docs/architecture.md.

  # SearXNG: a metasearch engine, queried from the LAN. It has no login of its
  # own, so it holds nothing worth protecting -- no accounts, no stored queries --
  # and the published port is open to the LAN and VPN like every workload's. It
  # runs without the limiter (a public-instance feature), so it needs no Valkey.
  # Upstream: https://docs.searxng.org/admin/installation-docker.html
  searxng:
    image: docker.io/searxng/searxng:2026.10.4-d48c4b555

    container_name: searxng

    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}

    volumes:
      - ./workloads/searxng/config:/etc/searxng
      - searxng-cache:/var/cache/searxng

    ports:
      - "8100:8080/tcp"

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - lab-stack

    restart: unless-stopped


  # SnapOtter: file processing for images, video, audio, PDF and documents, with
  # local AI models. Three containers, as upstream ships it (docker/docker-compose.yml
  # in snapotter-hq/SnapOtter), with its hardening kept but its memory limits LOWERED:
  # upstream's are 6 GB for the app, 1 GB for PostgreSQL and 512 MB for Redis (7.5 GiB),
  # which does not fit the 4 GiB LXC this runs in today. At 2 GB the app refuses its
  # heaviest modes (HQ erase wants 8 GB) and may fail a large video. Restore upstream's
  # limits when the LXC has 8 GiB (docs/proxmox.md).
  #
  # Its login is on and seeded from .env; it forces a password change at the first
  # sign-in. The official image reports usage analytics (PostHog) and Sentry errors
  # unless told not to; SNAPOTTER_TELEMETRY=0 below switches both off for good.
  snapotter:
    image: snapotter/snapotter:2.2.0

    container_name: snapotter

    environment:
      AUTH_ENABLED: "true"
      DEFAULT_USERNAME: admin
      DEFAULT_PASSWORD: ${SNAPOTTER_PASSWORD:?set SNAPOTTER_PASSWORD in .env}
      TRUST_PROXY: loopback,linklocal,uniquelocal
      # Kill switch honoured by every build: no analytics, no error reports.
      SNAPOTTER_TELEMETRY: "0"
      # 2.2.0 connects as the database owner. The least-privilege runtime role
      # (DATABASE_MIGRATION_URL plus a DML-only DATABASE_URL) arrived in 2.3.0, and
      # upstream's main branch, which this file was adapted from, already has it:
      # with 2.2.0 the app logs in as a role nobody created and exits.
      DATABASE_URL: postgres://snapotter:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@snapotter-db:5432/snapotter
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@snapotter-redis:6379

    volumes:
      - snapotter-data:/data
      - snapotter-workspace:/tmp/workspace

    ports:
      - "8101:1349/tcp"

    depends_on:
      snapotter-db:
        condition: service_healthy
      snapotter-redis:
        condition: service_healthy

    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 512
    shm_size: 1gb

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - KILL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "5", "http://localhost:1349/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    logging: *default-logging

    networks:
      - lab-stack

    restart: unless-stopped


  snapotter-db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193

    container_name: snapotter-db

    environment:
      POSTGRES_USER: snapotter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: snapotter

    volumes:
      - snapotter-pgdata:/var/lib/postgresql/data

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 2
    pids_limit: 256

    # Upstream's set: the image starts as root and drops to the postgres user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapotter -d snapotter"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

    logging: *default-logging

    networks:
      - lab-stack

    restart: unless-stopped


  snapotter-redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005

    container_name: snapotter-redis

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

    command: >-
      redis-server
      --maxmemory-policy noeviction
      --maxmemory 128mb
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

    volumes:
      - snapotter-redisdata:/data

    mem_limit: 256m
    memswap_limit: 256m
    cpus: 2
    pids_limit: 256

    # Upstream's set: the image starts as root and drops to the redis user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

    logging: *default-logging

    networks:
      - lab-stack

    restart: unless-stopped


  # ---------------------------------------------------------------------------
  # Agents -- this host's own metrics and logs
  # ---------------------------------------------------------------------------
  # Every stack runs its own copy of these two; only the servers they feed are
  # centralised (monitoring-stack). They measure the host, so they cannot be
  # moved. See monitoring/README.md.

  node-exporter:
    image: prom/node-exporter:v1.9.1

    container_name: node-exporter

    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # Basic auth, because this port is LAN-published for Prometheus to reach
      # and its output is a full inventory of the host. The firewall allowlist
      # is defence in depth, not the only control.
      - --web.config.file=/etc/node-exporter/web-config.yml

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./monitoring/web-config/node-exporter.yml:/etc/node-exporter/web-config.yml:ro

    ports:
      - "9100:9100/tcp"

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - lab-stack

    restart: unless-stopped


  alloy:
    image: grafana/alloy:v1.17.0

    container_name: alloy

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    environment:
      # Read by config.alloy via sys.env() -- Compose cannot interpolate into a
      # bind-mounted config file, but Alloy's config language reads the
      # environment at load time.
      MONITORING_HOST: ${MONITORING_HOST:?set MONITORING_HOST in .env}
      # Basic auth for that push -- Loki has no login of its own, so monitoring-stack
      # fronts it with loki-proxy instead.
      LOKI_PUSH_PASSWORD: ${LOKI_PUSH_PASSWORD:?set LOKI_PUSH_PASSWORD in .env}

    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./monitoring/alloy/data:/var/lib/alloy/data
      # Read-only: Alloy discovers containers and reads their logs, it never
      # needs to change anything. This mount is why alloy is the highest-value
      # target in this stack -- see docs/security.md.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro

    ports:
      - "12345:12345/tcp"

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - lab-stack

    restart: unless-stopped


  # ---------------------------------------------------------------------------
  # Documentation
  # ---------------------------------------------------------------------------

  # Read-only markdown, fetched client-side by documentation-stack's docs.lan
  # viewer. Mounts this repo's docs FILE BY FILE, never the repo root -- the
  # root holds .env. docs/audits/ is deliberately not served.
  docs-server:
    image: caddy:2.11.4

    container_name: lab-docs-server

    volumes:
      - ./docs-server/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./README.md:/srv/README.md:ro
      - ./docs/architecture.md:/srv/docs/architecture.md:ro
      - ./docs/networking.md:/srv/docs/networking.md:ro
      - ./docs/operations.md:/srv/docs/operations.md:ro
      - ./docs/proxmox.md:/srv/docs/proxmox.md:ro
      - ./docs/security.md:/srv/docs/security.md:ro
      - ./firewall/README.md:/srv/firewall/README.md:ro
      - ./monitoring/README.md:/srv/monitoring/README.md:ro
      - ./workloads/README.md:/srv/workloads/README.md:ro

    ports:
      - "8092:8092/tcp"

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

    networks:
      - lab-stack

    restart: unless-stopped


# Workload state, disposable like everything under workloads/: `docker compose down -v`
# wipes it. Docker-managed, because these images own their directories and chown them.
volumes:
  searxng-cache:
  snapotter-data:
  snapotter-workspace:
  snapotter-pgdata:
  snapotter-redisdata:


networks:

  lab-stack:
    name: lab-stack

    driver: bridge

    ipam:
      config:
        # Fixed, and distinct from the other stacks (172.19 network, 172.20
        # monitoring, 172.21 documentation). firewall/apply-rules.sh matches
        # egress on this exact subnet, so changing it here means changing it
        # there -- it is the identity of "traffic from a lab workload".
        - subnet: 172.22.0.0/16
